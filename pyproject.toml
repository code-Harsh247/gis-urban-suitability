[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-urban-suitability"
version = "0.1.0"
description = "GIS-based land suitability analysis for urban development using LULC data"
requires-python = ">=3.11"
authors = [{ name = "Harsh" }, { name = "Abhinav" }]
# Dependencies are managed by environment.yml (conda-forge).

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: needs internet access (deselect with -m 'not network')",
]
