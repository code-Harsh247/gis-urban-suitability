# Project configuration: the single source of truth for all parameters (PRD FR-1).
# Paths are relative to the repository root.

project:
  name: gis-urban-suitability
  random_seed: 42

aoi:
  path: config/aoi.geojson   # one polygon, EPSG:4326 (bbox from docs/study_area.md; refine in P0.10)
  name: Bengaluru South      # decision D1 (docs/execution_plan.md)
  buffer_m: 3000             # margin around the AOI for downloads, rings and distances; must be >= features.distance_cap_m (A3 done check)
  city_center: null          # optional [lon, lat] for dist_center feature

crs:
  epsg: auto                 # "auto" = UTM zone of the AOI centroid, or an EPSG code (metres)

grid:
  cell_size_m: 100

lulc:
  source: esri               # decision D2: ESRI IO LULC v02 for all features and labels
  worldcover_check: 2021     # WorldCover year used only as a cross-check

years:                       # decision D3 (ESRI 2017 is noisier; two years at each end)
  baseline: 2018             # features, reference buildings and roads are taken from this year
  baseline_confirm: 2019     # candidate cells must also be non-built in this year
  change_train_end: [2020, 2021]   # change-RF positives: built in both (decision D6)
  latest: 2023               # growth label: built in latest and latest_confirm
  latest_confirm: 2022

features:
  context_radii_m: [250, 500]
  road_density_radius_m: 500
  distance_cap_m: 3000       # distances are exact only up to aoi.buffer_m, so cap = buffer
  max_nodata_fraction: 0.5

exclusion:
  slope_max_deg: 15                    # decision D10
  esri_codes: [1, 4, 9]                # water, flooded vegetation, snow/ice
  worldcover_codes: [70, 80, 90, 95]   # cross-check only: snow/ice, water, wetland, mangroves
  max_excluded_fraction: 0.5           # cell excluded if more than this share is excluded class

clustering:                  # Phase 5 (PRD FR-5.1-5.3, §9.4)
  # own-cell fractions + terrain; frac_snow (always 0), frac_flooded, frac_bare (~0) and
  # slope_max (r = 0.95 with slope_mean) left out, see notebook 03
  inputs: [frac_water, frac_tree, frac_crop, frac_built, frac_range, elev_mean, slope_mean]
  k_min: 3
  k_max: 10
  method: kmeans             # kmeans | gmm; chosen from the scan in notebook 04
  k: 7                       # best silhouette; adds steep rangeland and the low western valley
  use_pca: false             # 7 standardised inputs; PCA is reported, not used
  pca_variance: 0.90
  silhouette_sample: 10000   # silhouette on a seeded sample (exact is O(n²) memory)

labeling:
  built_threshold: 0.3
  forest_threshold: 0.5
  cropland_usable: true      # decision D10 (Q5): usable, but flagged

growth:                      # temporal-validation labels (execution_plan A4)
  nonbuilt_max: 0.1          # cell counts as non-built below this built fraction
  built_min: 0.5             # cell counts as built at or above this built fraction
  lei_min_patch_m2: 5000     # growth patches smaller than this are ignored for LEI
  lei_buffer_m: 20

similarity:
  buffer_radii_m: [100, 250, 500]
  top_n: 20
  knn_k: 10
  metric: euclidean          # decision D5; cosine only as a comparison

qa:                          # plausibility ranges checked by the phase gates
  elevation_range_m: [600, 1200]   # Bengaluru plateau; observed 717-1033 m in the AOI + buffer

vector:                      # OSM cleaning (P3.4-P3.6, PRD FR-3.5)
  building_min_area_m2: 10   # smaller footprints are mapping errors / sheds
  building_max_area_m2: 100000  # outlier cap; largest real footprint in the AOI is 70,584 m² (industrial)
  keep_tracks: false         # highway=track (farm tracks) counted as minor roads if true

osm:
  snapshot_baseline: "2018-01-01"   # decisions D8, D9 (Overpass [date:] query)
  overpass_mirrors:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.private.coffee/api/interpreter

suitability:
  class_quantiles: [0.9, 0.7, 0.4]     # S1 >= q90, S2 >= q70, S3 >= q40, else N
  min_patch_area_m2: 10000

validation:
  spatial_block_m: 2000

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_features: data/features
  outputs: outputs
  figures: outputs/figures
  metrics: outputs/metrics
  logs: logs
